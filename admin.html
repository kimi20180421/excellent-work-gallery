<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9f8">
  <title>内容后台 · 像素100&奇点同行</title>
  <style>
    :root {
      --ink: #172224;
      --paper: #f7f9f8;
      --surface: #ffffff;
      --soft: #f1f5f3;
      --line: #dce5e1;
      --muted: #6c7a77;
      --cyan: #187b8b;
      --warm: #e7a36f;
      --radius: 14px;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 92% 0%, rgba(24, 123, 139, .06), transparent 24rem),
        radial-gradient(circle at 4% 100%, rgba(231, 163, 111, .08), transparent 22rem),
        var(--paper);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea { font: inherit; }

    .shell {
      width: min(1440px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar,
    .workspace,
    .list-head,
    .content-row,
    .form-actions {
      display: flex;
      align-items: center;
    }

    .topbar { justify-content: space-between; }

    .brand,
    .site-link {
      color: var(--ink);
      text-decoration: none;
    }

    .brand {
      font-size: 15px;
      font-weight: 500;
    }

    .brand span { color: var(--muted); font-weight: 400; }

    .site-link {
      color: var(--muted);
      font-size: 14px;
      transition: color .24s ease;
    }

    .site-link:hover,
    .site-link:focus-visible { color: var(--cyan); }

    .workspace {
      align-items: stretch;
      gap: 18px;
      margin-top: 28px;
    }

    .entry-panel,
    .library-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 14px 36px rgba(28, 45, 40, .07);
    }

    .entry-panel {
      order: 2;
      width: min(430px, 36%);
      padding: clamp(22px, 3vw, 34px);
    }

    .library-panel {
      order: 1;
      flex: 1;
      min-width: 0;
      padding: clamp(22px, 3vw, 34px);
    }

    h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .panel-note {
      margin: 9px 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .field-grid { display: grid; gap: 16px; }

    .field { display: grid; gap: 8px; }

    label {
      color: #41504d;
      font-size: 13px;
      font-weight: 500;
    }

    .optional { color: var(--muted); font-weight: 400; }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: 0;
      color: var(--ink);
      background: #fff;
      padding: 12px 13px;
      transition: border-color .24s ease, background .24s ease;
    }

    select option { color: var(--ink); background: #fff; }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--cyan);
      background: #fff;
    }

    input[type="file"] {
      padding: 9px;
      color: var(--muted);
      cursor: pointer;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .preview {
      display: none;
      width: 100%;
      margin-top: 4px;
      border-radius: 11px;
      background: var(--soft);
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .preview.is-visible { display: block; }

    .preview img,
    .preview video {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .preview img.is-visible,
    .preview video.is-visible { display: block; }

    .form-actions {
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      color: var(--ink);
      background: var(--cyan);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform .24s var(--ease), background .24s ease;
    }

    .button:hover { transform: translateY(-2px); background: #91e6ef; }
    .button:active { transform: translateY(0); }

    .button.secondary {
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line);
    }

    .button.secondary:hover { color: var(--ink); background: var(--soft); }

    .library-top { display: block; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 20px;
    }

    .stat {
      min-width: 0;
      padding: 12px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: var(--soft);
      font-size: 11px;
      text-align: center;
      cursor: pointer;
      transition: border-color .24s ease, background .24s ease, color .24s ease;
    }

    .stat strong {
      display: block;
      margin-bottom: 2px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 500;
    }

    .stat[aria-current="true"] {
      border-color: #a7dfe6;
      color: #176b78;
      background: #e7f7f9;
    }

    .stat[aria-current="true"] strong { color: #176b78; }

    .content-list { margin-top: 24px; }

    .list-head,
    .content-row {
      gap: 14px;
      padding: 0 0 12px;
      border-bottom: 1px solid #e5ebe8;
    }

    .list-head {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .1em;
    }

    .content-row {
      padding: 14px 0;
    }

    .content-thumb {
      width: 84px;
      height: 48px;
      flex: 0 0 auto;
      border-radius: 8px;
      object-fit: cover;
      background: var(--soft);
    }

    .content-main {
      min-width: 0;
      flex: 1;
    }

    .content-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 500;
    }

    .content-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .type-tag {
      min-width: 78px;
      color: #237483;
      font-size: 12px;
      text-align: right;
    }

    .delete-button {
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      cursor: pointer;
    }

    .delete-button:hover { color: #f08e82; }

    .empty {
      padding: 52px 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .notice {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      max-width: min(360px, calc(100vw - 40px));
      padding: 13px 16px;
      border: 1px solid #9fdbe4;
      border-radius: 12px;
      color: #efffff;
      background: #17454d;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity .24s ease, transform .24s var(--ease);
    }

    .notice.is-visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 860px) {
      .workspace { display: grid; }
      .entry-panel { width: auto; }
    }

    @media (max-width: 600px) {
      .shell { width: min(100% - 24px, 1440px); padding-top: 18px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .type-tag { display: none; }
      .content-thumb { width: 68px; height: 44px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">像素100&奇点同行 <span>· 内容后台</span></a>
      <a class="site-link" href="index.html">查看前台</a>
    </header>

    <section class="workspace">
      <form class="entry-panel" id="content-form">
        <h2>录入内容</h2>
        <p class="panel-note">Offer 捷报建议使用 9:16 竖版图片。图片与短视频均可上传，视频超过 3MB 请填写可公开访问的 MP4 地址。</p>

        <div class="field-grid">
          <div class="field">
            <label for="channel">内容类别</label>
            <select id="channel" name="channel">
              <option value="works">优秀作业展</option>
              <option value="offers">Offer 捷报</option>
              <option value="interviews">面试间接龙</option>
              <option value="moments">轻松一刻</option>
            </select>
          </div>

          <div class="field">
            <label for="title">标题</label>
            <input id="title" name="title" maxlength="60" placeholder="例如：腾讯互动娱乐设计岗 Offer" required>
          </div>

          <div class="field">
            <label for="author">作者 / 投稿人</label>
            <input id="author" name="author" maxlength="40" placeholder="例如：张同学">
          </div>

          <div class="field">
            <label for="media-type">媒体类型</label>
            <select id="media-type" name="mediaType">
              <option value="image">图片</option>
              <option value="video">视频</option>
            </select>
          </div>

          <div class="field">
            <label for="media-url">媒体地址 <span class="optional">填写地址或上传媒体二选一</span></label>
            <input id="media-url" name="source" type="url" placeholder="https://example.com/content.jpg 或 .mp4">
          </div>

          <div class="field" id="upload-field">
            <label for="media-file" id="media-file-label">上传图片 <span class="optional">建议小于 2MB</span></label>
            <input id="media-file" type="file" accept="image/*">
          </div>

          <div class="field">
            <label for="description">说明 <span class="optional">可选</span></label>
            <textarea id="description" name="description" maxlength="140" placeholder="用于后台识别与归档，不会覆盖前台作品图。"></textarea>
          </div>

          <div class="preview" id="preview">
            <img id="image-preview" alt="上传图片预览">
            <video id="video-preview" controls muted playsinline></video>
          </div>
        </div>

        <div class="form-actions">
          <button class="button secondary" type="reset">清空</button>
          <button class="button" type="submit">保存并加入播放</button>
        </div>
      </form>

      <section class="library-panel">
        <div class="library-top">
          <h2>内容库</h2>
          <div class="stats" id="stats"></div>
        </div>

        <div class="content-list" id="content-list"></div>
      </section>
    </section>
  </main>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <script>
    const CONTENT_STORAGE_KEY = 'pixel100-gallery-content-v1';
    const channelNames = {
      works: '优秀作业展',
      offers: 'Offer 捷报',
      interviews: '面试间接龙',
      moments: '轻松一刻'
    };
    const managedChannels = new Set(Object.keys(channelNames));
    const builtinContent = [
      { id: 'builtin-01', channel: 'works', title: '视觉语言形状分析', author: '黎浩民', source: 'assets/li-haomin-01.webp' },
      { id: 'builtin-02', channel: 'works', title: '视觉语言质感分析', author: '黎浩民', source: 'assets/li-haomin-02.webp' },
      { id: 'builtin-03', channel: 'works', title: '根据用户选择路径重构页面结构', author: '陈静芸', source: 'assets/chen-jingyun-01.webp' },
      { id: 'builtin-04', channel: 'works', title: '围绕交易链路开展半结构式访谈', author: '卢若溪', source: 'assets/lu-ruoxi-01.webp' },
      { id: 'builtin-05', channel: 'works', title: '生活服务图标设计', author: '安炳均', source: 'assets/an-bingjun-01.webp' },
      { id: 'builtin-06', channel: 'works', title: 'IP卡牌主视觉设计', author: '赵一仪', source: 'assets/zhao-yiyi-01.webp' },
      { id: 'builtin-07', channel: 'works', title: '影视内容筛选体验优化', author: '马冰蕊', source: 'assets/ma-bingrui-01.webp' },
      { id: 'builtin-08', channel: 'works', title: '美团拼好饭首页体验优化', author: '李祎珺', source: 'assets/li-yijun-01.webp' },
      { id: 'builtin-09', channel: 'works', title: '微博暑假主题活动视觉设计', author: '马冰蕊', source: 'assets/ma-bingrui-02.webp' },
      { id: 'builtin-10', channel: 'works', title: '模块化设计', author: '马冰蕊', source: 'assets/mbr.png' },
      { id: 'builtin-11', channel: 'works', title: 'QQ招兽闹新春主页面展示', author: '陈静芸', source: 'assets/CHENJINGYUN.png' },
      { id: 'builtin-12', channel: 'works', title: 'QQ招兽闹新春分享海报', author: '陈静芸', source: 'assets/chen.png' }
    ];
    const form = document.querySelector('#content-form');
    const sourceInput = document.querySelector('#media-url');
    const fileInput = document.querySelector('#media-file');
    const fileLabel = document.querySelector('#media-file-label');
    const mediaType = document.querySelector('#media-type');
    const uploadField = document.querySelector('#upload-field');
    const preview = document.querySelector('#preview');
    const imagePreview = document.querySelector('#image-preview');
    const videoPreview = document.querySelector('#video-preview');
    const contentList = document.querySelector('#content-list');
    const stats = document.querySelector('#stats');
    const notice = document.querySelector('#notice');
    let uploadedSource = '';
    let noticeTimer;
    let activeChannel = 'works';
    const MAX_IMAGE_UPLOAD_BYTES = 2 * 1024 * 1024;
    const MAX_VIDEO_UPLOAD_BYTES = 3 * 1024 * 1024;

    function readContent() {
      try {
        const content = JSON.parse(localStorage.getItem(CONTENT_STORAGE_KEY) || '[]');
        return Array.isArray(content) ? content.filter(isValidManagedContent) : [];
      } catch {
        return [];
      }
    }

    function isValidManagedContent(content) {
      return Boolean(
        content
        && typeof content.id === 'string'
        && managedChannels.has(content.channel)
        && typeof content.title === 'string'
        && content.title.trim()
        && ['image', 'video'].includes(content.mediaType)
        && typeof content.source === 'string'
        && content.source.trim()
      );
    }

    function saveContent(content) {
      localStorage.setItem(CONTENT_STORAGE_KEY, JSON.stringify(content));
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.classList.add('is-visible');
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => notice.classList.remove('is-visible'), 3000);
    }

    function renderStats(content) {
      stats.replaceChildren();
      Object.entries(channelNames).forEach(([key, name]) => {
        const item = document.createElement('button');
        item.className = 'stat';
        item.type = 'button';
        item.setAttribute('aria-current', String(key === activeChannel));
        const count = content.filter(entry => entry.channel === key).length;
        item.innerHTML = `<strong>${count}</strong>${name}`;
        item.addEventListener('click', () => {
          activeChannel = key;
          renderList();
        });
        stats.append(item);
      });
    }

    function renderList() {
      const content = [...builtinContent, ...readContent()];
      const channelContent = content.filter(entry => entry.channel === activeChannel);
      contentList.replaceChildren();
      renderStats(content);

      if (!channelContent.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = `暂未录入「${channelNames[activeChannel]}」内容。`;
        contentList.append(empty);
        return;
      }

      channelContent
        .slice()
        .reverse()
        .forEach(entry => {
          const row = document.createElement('div');
          row.className = 'content-row';

          const thumb = entry.mediaType === 'video'
            ? document.createElement('video')
            : document.createElement('img');
          thumb.className = 'content-thumb';
          thumb.src = entry.source;
          thumb.preload = 'metadata';
          thumb.muted = true;

          const main = document.createElement('div');
          main.className = 'content-main';
          const title = document.createElement('div');
          title.className = 'content-title';
          title.textContent = entry.title || '未命名内容';
          const meta = document.createElement('div');
          meta.className = 'content-meta';
          meta.textContent = `作者：${entry.author || '未填写'}${entry.description ? ` · ${entry.description}` : ''}`;
          main.append(title, meta);

          const type = document.createElement('div');
          type.className = 'type-tag';
          type.textContent = entry.id.startsWith('builtin-')
            ? '网站内置'
            : channelNames[entry.channel] || channelNames.works;

          row.append(thumb, main, type);
          if (!entry.id.startsWith('builtin-')) {
            const remove = document.createElement('button');
            remove.className = 'delete-button';
            remove.type = 'button';
            remove.textContent = '删除';
            remove.addEventListener('click', () => {
              const nextContent = readContent().filter(item => item.id !== entry.id);
              saveContent(nextContent);
              renderList();
              showNotice('内容已从本地内容库移除。');
            });
            row.append(remove);
          }
          contentList.append(row);
        });
    }

    function resetPreview() {
      uploadedSource = '';
      imagePreview.removeAttribute('src');
      videoPreview.pause();
      videoPreview.removeAttribute('src');
      preview.classList.remove('is-visible');
      imagePreview.classList.remove('is-visible');
      videoPreview.classList.remove('is-visible');
    }

    function updateUploadField() {
      const isVideo = mediaType.value === 'video';
      fileInput.accept = isVideo ? 'video/*' : 'image/*';
      fileLabel.innerHTML = isVideo
        ? '上传视频 <span class="optional">建议小于 3MB</span>'
        : '上传图片 <span class="optional">建议小于 2MB</span>';
    }

    mediaType.addEventListener('change', () => {
      fileInput.value = '';
      resetPreview();
      updateUploadField();
    });

    fileInput.addEventListener('change', () => {
      const [file] = fileInput.files;
      if (!file) {
        resetPreview();
        return;
      }
      const isVideo = mediaType.value === 'video';
      if (!file.type.startsWith(isVideo ? 'video/' : 'image/')) {
        fileInput.value = '';
        resetPreview();
        showNotice(`请选择${isVideo ? '视频' : '图片'}文件。`);
        return;
      }
      const sizeLimit = isVideo ? MAX_VIDEO_UPLOAD_BYTES : MAX_IMAGE_UPLOAD_BYTES;
      if (file.size > sizeLimit) {
        fileInput.value = '';
        resetPreview();
        showNotice(`${isVideo ? '视频' : '图片'}超过 ${isVideo ? '3MB' : '2MB'}，请压缩后上传或填写外部地址。`);
        return;
      }
      const reader = new FileReader();
      reader.addEventListener('load', () => {
        uploadedSource = reader.result;
        preview.classList.add('is-visible');
        if (isVideo) {
          videoPreview.src = uploadedSource;
          videoPreview.classList.add('is-visible');
        } else {
          imagePreview.src = uploadedSource;
          imagePreview.classList.add('is-visible');
        }
        sourceInput.value = '';
      });
      reader.readAsDataURL(file);
    });

    form.addEventListener('reset', () => {
      requestAnimationFrame(() => {
        uploadField.hidden = false;
        resetPreview();
        updateUploadField();
      });
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      const data = new FormData(form);
      const title = String(data.get('title') || '').trim();
      const source = uploadedSource || String(data.get('source') || '').trim();
      const channel = String(data.get('channel'));
      const type = String(data.get('mediaType'));

      if (!title || !source) {
        showNotice('请填写标题，并填写媒体地址或上传媒体。');
        return;
      }

      const content = readContent();
      content.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        channel,
        title,
        author: String(data.get('author') || '').trim(),
        description: String(data.get('description') || '').trim(),
        mediaType: type,
        source,
        createdAt: new Date().toISOString()
      });

      try {
        saveContent(content);
      } catch {
        showNotice('保存失败：本地存储空间不足。请使用外部图片地址或更小的图片。');
        return;
      }

      form.reset();
      activeChannel = channel;
      renderList();
      showNotice(`已加入「${channelNames[channel]}」，刷新前台即可播放。`);
    });

    updateUploadField();
    renderList();
  </script>
</body>
</html>
