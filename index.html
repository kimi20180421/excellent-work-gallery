<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080909">
  <title>像素100&奇点同行 · 优秀作业展</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #080909;
      --white: #f4f7f8;
      --muted: rgba(244, 247, 248, .56);
      --cyan: #63d8e8;
      --radius: clamp(16px, 1.5vw, 24px);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --duration: 680ms;
      --autoplay: 5600ms;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
    }

    body {
      color: var(--white);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      height: clamp(66px, 8.5vh, 88px);
      display: flex;
      align-items: center;
      padding-inline: clamp(18px, 3vw, 48px);
      pointer-events: none;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--white);
      font-size: clamp(15px, 1.2vw, 19px);
      font-weight: 500;
      line-height: 1.4;
      text-decoration: none;
      pointer-events: auto;
    }

    .brand-logo {
      width: clamp(25px, 2.2vw, 32px);
      height: auto;
      display: block;
    }

    .brand-suffix {
      color: var(--muted);
      font-weight: 400;
    }

    .admin-link {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      pointer-events: auto;
      transition: color 240ms ease;
    }

    .admin-link:hover,
    .admin-link:focus-visible {
      color: var(--cyan);
    }

    .carousel {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      background:
        radial-gradient(circle at 50% 44%, rgba(49, 89, 217, .08), transparent 42%),
        var(--black);
    }

    .slides {
      position: absolute;
      inset: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      padding: clamp(76px, 10vh, 108px) clamp(18px, 6vw, 96px) clamp(78px, 9vh, 104px);
      opacity: 0;
      visibility: hidden;
      transform: translate3d(10%, 0, 0) scale(.985);
      transition:
        transform var(--duration) var(--ease),
        opacity 420ms ease,
        visibility 0s linear var(--duration);
      will-change: transform, opacity;
      pointer-events: none;
    }

    .slide[data-state="before"] {
      transform: translate3d(-10%, 0, 0) scale(.985);
    }

    .slide[data-state="active"],
    .slide[data-state="active-secondary"] {
      z-index: 2;
      opacity: 1;
      visibility: visible;
      transform: translate3d(0, 0, 0) scale(1);
      transition-delay: 0s;
      pointer-events: auto;
    }

    .artwork {
      position: relative;
      width: min(94vw, 1680px, calc((100svh - 210px) * 16 / 9));
    }

    .artwork img,
    .artwork video {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      display: block;
      object-fit: contain;
      object-position: center;
      overflow: hidden;
      border-radius: var(--radius);
      background: #101314;
      box-shadow: 0 28px 90px rgba(0, 0, 0, .48);
    }

    .caption {
      display: flex;
      align-items: center;
      padding: clamp(12px, 1.3vw, 18px) 2px 0;
      color: rgba(244, 247, 248, .78);
    }

    .student {
      font-size: clamp(14px, 1.15vw, 18px);
      font-weight: 500;
      letter-spacing: .04em;
    }

    .carousel-guide {
      position: fixed;
      left: 50%;
      bottom: clamp(76px, 9vh, 100px);
      z-index: 20;
      width: min(62vw, 360px);
      display: grid;
      grid-template-columns: repeat(var(--guide-count, 8), 1fr);
      gap: clamp(5px, .65vw, 9px);
      transform: translateX(-50%);
    }

    .channel-nav {
      position: fixed;
      left: 50%;
      bottom: clamp(18px, 2.5vh, 30px);
      z-index: 20;
      display: flex;
      max-width: calc(100vw - 36px);
      gap: 5px;
      padding: 5px;
      overflow-x: auto;
      border: 1px solid rgba(244, 247, 248, .14);
      border-radius: 999px;
      background: rgba(8, 9, 9, .72);
      transform: translateX(-50%);
      scrollbar-width: none;
    }

    .channel-nav::-webkit-scrollbar { display: none; }

    .channel-item {
      flex: 0 0 auto;
      padding: 9px 13px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-size: clamp(12px, 1vw, 14px);
      font-weight: 500;
      cursor: pointer;
      transition: color 240ms ease, background 240ms ease;
    }

    .channel-item[aria-current="true"] {
      color: var(--white);
      background: rgba(99, 216, 232, .16);
    }

    .channel-item:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .guide-item {
      position: relative;
      height: 18px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .guide-item[hidden] { display: none; }

    .category-slide {
      background:
        radial-gradient(circle at 28% 26%, rgba(99, 216, 232, .16), transparent 24%),
        radial-gradient(circle at 72% 70%, rgba(49, 89, 217, .18), transparent 28%);
    }

    .category-message {
      width: min(86vw, 760px);
      padding: clamp(28px, 5vw, 64px);
      border: 1px solid rgba(244, 247, 248, .16);
      border-radius: var(--radius);
      background: rgba(16, 19, 20, .68);
    }

    .category-label,
    .category-title,
    .category-copy {
      display: block;
    }

    .category-label {
      margin-bottom: 14px;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .16em;
    }

    .category-title {
      font-size: clamp(32px, 5vw, 68px);
      font-weight: 500;
      letter-spacing: -.04em;
    }

    .category-copy {
      max-width: 32em;
      margin-top: 18px;
      color: rgba(244, 247, 248, .62);
      font-size: clamp(15px, 1.35vw, 19px);
      line-height: 1.75;
    }

    .carousel[data-per-view="2"] .slide[data-state="active"] {
      inset: 0 0 50%;
      padding: clamp(68px, 7vh, 82px) clamp(18px, 5vw, 80px) 8px;
    }

    .carousel[data-per-view="2"] .slide[data-state="active-secondary"] {
      inset: 50% 0 0;
      padding: 8px clamp(18px, 5vw, 80px) clamp(62px, 7vh, 76px);
    }

    .carousel[data-per-view="2"] .artwork {
      width: min(92vw, 1280px, calc((50svh - 118px) * 16 / 9));
    }

    .carousel[data-per-view="2"] .caption {
      padding-top: 8px;
    }

    .guide-item::before,
    .guide-item::after {
      content: "";
      position: absolute;
      inset: 8px 0 auto;
      height: 2px;
      border-radius: 99px;
    }

    .guide-item::before { background: rgba(255, 255, 255, .2); }

    .guide-item::after {
      background: var(--cyan);
      transform: scaleX(0);
      transform-origin: left center;
    }

    .guide-item[aria-current="true"]::before { background: rgba(255, 255, 255, .34); }

    .guide-item[aria-current="true"]::after {
      animation: progress var(--autoplay) linear forwards;
    }

    .guide-item:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes progress {
      to { transform: scaleX(1); }
    }

    @media (max-width: 680px) {
      .site-header { height: 64px; }
      .brand { gap: 8px; }
      .brand-suffix { display: none; }
      .slide { padding: 72px 12px 82px; }
      .artwork {
        width: min(calc(100vw - 24px), calc((100svh - 190px) * 16 / 9));
      }
      .artwork img { border-radius: 16px; }
      .carousel-guide { width: calc(100vw - 36px); gap: 4px; bottom: 76px; }
      .channel-nav { width: calc(100vw - 24px); justify-content: flex-start; }
      .channel-item { padding: 8px 11px; }
      .caption { padding: 12px 2px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide {
        transition-duration: 1ms !important;
        transform: none !important;
      }
      .guide-item[aria-current="true"]::after {
        animation: none;
        transform: scaleX(1);
      }
    }
  </style>
</head>

  <script>
    const CONTENT_STORAGE_KEY = 'pixel100-gallery-content-v1';
    let managedContent = [];
    try {
      managedContent = JSON.parse(localStorage.getItem(CONTENT_STORAGE_KEY) || '[]');
    } catch {
      managedContent = [];
    }
    const slidesContainer = document.querySelector('.slides');

    function appendManagedContent(content, index) {
      const slide = document.createElement('figure');
      const channel = ['works', 'offers', 'interviews', 'moments'].includes(content.channel)
        ? content.channel
        : 'works';
      const title = content.title || '未命名内容';
      const author = content.author || '像素100&奇点同行';
      const media = content.mediaType === 'video'
        ? document.createElement('video')
        : document.createElement('img');

      slide.className = 'slide';
      slide.id = `managed-slide-${index}`;
      slide.dataset.channel = channel;
      slide.dataset.state = 'after';

      media.src = content.source;
      media.alt = `${author}的内容：${title}`;
      media.preload = 'metadata';
      if (content.mediaType === 'video') {
        media.controls = true;
        media.playsInline = true;
      } else {
        media.loading = 'lazy';
      }

      const artwork = document.createElement('div');
      artwork.className = 'artwork';
      artwork.append(media);

      const caption = document.createElement('figcaption');
      caption.className = 'caption';
      const student = document.createElement('span');
      student.className = 'student';
      student.textContent = `${content.title ? `${title} · ` : ''}作者：${author}`;
      caption.append(student);
      artwork.append(caption);
      slide.append(artwork);
      slidesContainer.append(slide);
    }

    managedContent
      .filter(content => content && content.source)
      .forEach(appendManagedContent);

    const carousel = document.querySelector('.carousel');
    const slides = [...document.querySelectorAll('.slide')];
    const guide = document.querySelector('.carousel-guide');
    let guideItems = [...document.querySelectorAll('.guide-item')];
    const channelItems = [...document.querySelectorAll('.channel-item')];
    const status = document.querySelector('#carousel-status');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const AUTOPLAY_DELAY = 5600;
    const TWO_UP_HEIGHT_RESERVE = 118;
    const TWO_UP_MIN_ARTWORK_WIDTH = 400;
    const TWO_UP_MIN_VIEWPORT_WIDTH = 700;
    const channelOrder = channelItems.map(item => item.dataset.channel);
    let perView = 1;
    let currentPage = 0;
    let currentChannel = channelOrder[0];
    let timer;
    let pointerStartX = null;
    let resizeFrame;

    function channelSlides() {
      return slides.filter(slide => (slide.dataset.channel || 'works') === currentChannel);
    }

    function pageCount() {
      return Math.ceil(channelSlides().length / perView);
    }

    function shouldShowTwoUp() {
      return currentChannel !== 'offers'
        && channelSlides().length > 1
        && fitsTwoWorks();
    }

    function updateGuide() {
      const count = pageCount();
      while (guideItems.length < count) {
        const item = document.createElement('button');
        const label = document.createElement('span');
        item.className = 'guide-item';
        item.type = 'button';
        item.setAttribute('aria-current', 'false');
        label.className = 'sr-only';
        item.append(label);
        item.addEventListener('click', () => setPage(Number(item.dataset.index)));
        guide.append(item);
        guideItems.push(item);
      }

      guide.style.setProperty('--guide-count', count);

      guideItems.forEach((item, index) => {
        const visible = index < count;
        item.hidden = !visible;
        if (!visible) return;
        item.dataset.index = index;
        const label = perView === 2 ? `查看第 ${index + 1} 组作品` : `查看第 ${index + 1} 张作品`;
        item.querySelector('.sr-only').textContent = label;
      });
    }

    function updateChannelNav() {
      channelItems.forEach(item => {
        item.setAttribute('aria-current', String(item.dataset.channel === currentChannel));
      });
    }

    function setPage(nextPage, restart = true) {
      const currentSlides = channelSlides();
      const count = pageCount();
      const normalized = (nextPage + count) % count;
      if (normalized === currentPage && !restart) return;
      const firstVisible = normalized * perView;
      const secondVisible = perView === 2 && firstVisible + 1 < currentSlides.length ? firstVisible + 1 : -1;

      slides.forEach(slide => {
        const index = currentSlides.indexOf(slide);
        const state = index === firstVisible
          ? 'active'
          : index === secondVisible
            ? 'active-secondary'
            : index < firstVisible
              ? 'before'
              : 'after';
        slide.dataset.state = state;
        slide.setAttribute('aria-hidden', String(index !== firstVisible && index !== secondVisible));
      });

      guideItems.forEach((item, index) => {
        item.setAttribute('aria-current', String(index === normalized));
      });

      currentPage = normalized;
      const firstName = currentSlides[firstVisible].querySelector('.student')?.textContent || channelItems.find(item => item.dataset.channel === currentChannel).textContent;
      if (secondVisible >= 0) {
        const secondName = currentSlides[secondVisible].querySelector('.student')?.textContent || firstName;
        status.textContent = `正在展示第 ${firstVisible + 1} 至 ${secondVisible + 1} 张作品，${firstName}、${secondName}`;
      } else {
        status.textContent = `正在展示${channelItems.find(item => item.dataset.channel === currentChannel).textContent}：${firstName}`;
      }

      if (restart) startAutoplay();
    }

    function selectChannel(channel, restart = true) {
      currentChannel = channel;
      currentPage = 0;
      carousel.dataset.channel = channel;
      perView = shouldShowTwoUp() ? 2 : 1;
      carousel.dataset.perView = String(perView);
      updateChannelNav();
      updateGuide();
      setPage(0, restart);
    }

    function advancePage(direction = 1) {
      const nextPage = currentPage + direction;
      if (nextPage >= 0 && nextPage < pageCount()) {
        setPage(nextPage);
        return;
      }

      const channelIndex = channelOrder.indexOf(currentChannel);
      const nextChannelIndex = (channelIndex + direction + channelOrder.length) % channelOrder.length;
      selectChannel(channelOrder[nextChannelIndex], false);
      setPage(direction > 0 ? 0 : pageCount() - 1);
    }

    function fitsTwoWorks() {
      const viewportWidth = window.visualViewport?.width ?? window.innerWidth;
      const viewportHeight = window.visualViewport?.height ?? window.innerHeight;
      const widthAllowedByViewport = Math.min(viewportWidth * .92, 1280);
      const imageHeightPerWork = Math.max(0, viewportHeight / 2 - TWO_UP_HEIGHT_RESERVE);
      const proportionalArtworkWidth = Math.min(
        widthAllowedByViewport,
        imageHeightPerWork * 16 / 9
      );

      return viewportWidth >= TWO_UP_MIN_VIEWPORT_WIDTH
        && proportionalArtworkWidth >= TWO_UP_MIN_ARTWORK_WIDTH;
    }

    function updateMode() {
      const firstVisible = currentPage * perView;
      perView = shouldShowTwoUp() ? 2 : 1;
      carousel.dataset.perView = String(perView);
      currentPage = Math.floor(firstVisible / perView);
      updateGuide();
      setPage(currentPage);
    }

    function scheduleModeUpdate() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(updateMode);
    }

    function startAutoplay() {
      clearTimeout(timer);
      if (reducedMotion.matches || document.hidden) return;
      timer = setTimeout(() => advancePage(), AUTOPLAY_DELAY);
    }

    guideItems.forEach(item => {
      item.addEventListener('click', () => setPage(Number(item.dataset.index)));
    });

    channelItems.forEach(item => {
      item.addEventListener('click', () => selectChannel(item.dataset.channel));
    });

    carousel.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight') advancePage();
      if (event.key === 'ArrowLeft') advancePage(-1);
    });

    carousel.addEventListener('pointerdown', event => {
      pointerStartX = event.clientX;
    });

    carousel.addEventListener('pointerup', event => {
      if (pointerStartX === null) return;
      const distance = event.clientX - pointerStartX;
      pointerStartX = null;
      if (Math.abs(distance) < 50) return;
      advancePage(distance < 0 ? 1 : -1);
    });

    document.addEventListener('visibilitychange', startAutoplay);
    reducedMotion.addEventListener('change', startAutoplay);
    window.addEventListener('resize', scheduleModeUpdate, { passive: true });
    window.visualViewport?.addEventListener('resize', scheduleModeUpdate, { passive: true });
    selectChannel(currentChannel);
  </script>
</body>
</html>
