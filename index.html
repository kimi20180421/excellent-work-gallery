<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080909">
  <title>像素100&amp;奇点同行 · 优秀作业展</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #080909;
      --white: #f4f7f8;
      --muted: rgba(244, 247, 248, .56);
      --cyan: #63d8e8;
      --radius: clamp(16px, 1.5vw, 24px);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --duration: 680ms;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
    }

    body {
      color: var(--white);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      height: clamp(66px, 8.5vh, 88px);
      display: flex;
      align-items: center;
      padding-inline: clamp(18px, 3vw, 48px);
      pointer-events: none;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--white);
      font-size: clamp(15px, 1.2vw, 19px);
      font-weight: 500;
      line-height: 1.4;
      text-decoration: none;
      pointer-events: auto;
    }

    .brand-logo {
      width: clamp(25px, 2.2vw, 32px);
      height: auto;
      display: block;
    }

    .brand-suffix {
      color: var(--muted);
      font-weight: 400;
    }

    .admin-link {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      pointer-events: auto;
      transition: color 240ms ease;
    }

    .admin-link:hover,
    .admin-link:focus-visible {
      color: var(--cyan);
    }

    .gallery {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 520px;
      padding: clamp(70px, 9vh, 92px) clamp(14px, 2vw, 30px) clamp(14px, 2vw, 28px);
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 35%, rgba(42, 84, 196, .07), transparent 40%),
        var(--black);
    }

    .gallery-grid {
      width: min(100%, 1680px);
      height: 100%;
      margin-inline: auto;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, .72fr);
      gap: 0;
    }

    .left-column {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 0;
      padding-right: clamp(12px, 1.4vw, 24px);
      border-right: 1px solid rgba(244, 247, 248, .16);
    }

    .channel-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      outline: none;
    }

    .left-column .channel-panel:first-child {
      border-bottom: 1px solid rgba(244, 247, 248, .16);
    }

    .channel-panel[data-channel="offers"] {
      margin-left: clamp(12px, 1.4vw, 24px);
    }

    .channel-panel:focus-visible .panel-title {
      color: var(--cyan);
    }

    .panel-head {
      position: absolute;
      inset: 0 0 auto;
      z-index: 8;
      height: 42px;
      display: flex;
      align-items: center;
      padding: 0 12px 0 14px;
      background: transparent;
    }

    .panel-title {
      color: var(--white);
      font-size: 13px;
      font-weight: 500;
    }

    .panel-count {
      margin-left: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .panel-controls {
      margin-left: auto;
      display: flex;
      gap: 3px;
    }

    .panel-control {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: rgba(244, 247, 248, .72);
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      transition: color 240ms ease, transform 240ms var(--ease);
    }

    .panel-control:hover,
    .panel-control:focus-visible {
      color: var(--white);
      outline: none;
      transform: scale(1.08);
    }

    .panel-stage {
      position: absolute;
      inset: 42px 0 0;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      padding: clamp(8px, 1vw, 14px);
      opacity: 0;
      visibility: hidden;
      transform: translate3d(5%, 0, 0) scale(.99);
      transition:
        transform var(--duration) var(--ease),
        opacity 360ms ease,
        visibility 0s linear var(--duration);
      pointer-events: none;
    }

    .slide[data-state="before"] {
      transform: translate3d(-5%, 0, 0) scale(.99);
    }

    .slide[data-state="active"] {
      z-index: 2;
      opacity: 1;
      visibility: visible;
      transform: translate3d(0, 0, 0) scale(1);
      transition-delay: 0s;
      pointer-events: auto;
    }

    .artwork {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .artwork img,
    .artwork video {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: block;
      object-fit: contain;
      object-position: center;
      border-radius: 12px;
      background: #080909;
      box-shadow: 0 18px 54px rgba(0, 0, 0, .32);
    }

    .caption {
      flex: 0 0 24px;
      width: 100%;
      display: flex;
      align-items: flex-end;
      padding-inline: 2px;
      color: rgba(244, 247, 248, .72);
      font-size: 12px;
      font-weight: 500;
    }

    .channel-panel[data-channel="moments"] .caption,
    .channel-panel[data-channel="offers"] .caption {
      display: none;
    }

    .channel-panel[data-channel="offers"] .artwork img,
    .channel-panel[data-channel="offers"] .artwork video {
      background: transparent;
    }

    .panel-empty {
      position: absolute;
      inset: 42px 0 0;
      display: none;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .channel-panel[data-empty="true"] .panel-empty {
      display: grid;
    }

    .slide-source { display: none; }

    .portrait-nav {
      display: none;
    }

    .portrait-nav-item {
      position: relative;
      min-width: 0;
      min-height: 44px;
      padding: 0 10px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .portrait-nav-item[aria-current="true"] {
      color: var(--white);
    }

    .portrait-nav-item[aria-current="true"]::after {
      content: "";
      position: absolute;
      inset: auto 10px 2px;
      height: 2px;
      background: var(--cyan);
    }

    .portrait-nav-item:focus-visible {
      color: var(--cyan);
      outline: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (orientation: portrait) {
      html,
      body {
        overflow: hidden;
      }

      .gallery {
        height: 100svh;
        min-height: 0;
        overflow: hidden;
        padding: 68px 12px 72px;
      }

      .gallery-grid {
        width: 100%;
        height: 100%;
        display: block;
      }

      .left-column {
        display: contents;
        padding-right: 0;
        border-right: 0;
      }

      .channel-panel {
        display: none;
        width: 100%;
        height: 100%;
        min-height: 0;
        border: 0 !important;
      }

      .channel-panel[data-portrait-active="true"] {
        display: block;
      }

      .channel-panel[data-channel="offers"] {
        margin-left: 0;
      }

      .panel-head {
        height: 44px;
        padding-inline: 4px;
      }

      .panel-stage {
        inset: 44px 0 0;
      }

      .panel-control {
        width: 44px;
        height: 44px;
      }

      .slide {
        padding: 12px;
      }

      .portrait-nav {
        position: fixed;
        inset: auto 12px 10px;
        z-index: 20;
        height: 52px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 1px solid rgba(244, 247, 248, .16);
        background: var(--black);
      }
    }

    @media (max-width: 560px) {
      .site-header { height: 64px; }
      .brand { gap: 8px; }
      .brand-suffix { display: none; }
      .panel-head { height: 40px; }
      .panel-stage { inset-block-start: 40px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .site-header {
        height: 52px;
      }

      .gallery {
        min-height: 0;
        padding: 52px 10px 10px;
      }

      .gallery-grid {
        grid-template-columns: minmax(0, 1.55fr) minmax(190px, .72fr);
      }

      .left-column {
        padding-right: 8px;
      }

      .channel-panel[data-channel="offers"] {
        margin-left: 8px;
      }

      .panel-head {
        height: 34px;
        padding-inline: 6px;
      }

      .panel-stage {
        inset-block-start: 34px;
      }

      .caption {
        flex-basis: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide {
        transition-duration: 1ms !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="site-header">
    <a class="brand" href="#gallery" aria-label="像素100与奇点同行优秀作业展">
      <img class="brand-logo" src="assets/brand-logo.png" alt="像素100&奇点同行 logo">
      <span>像素100&amp;奇点同行</span>
      <span class="brand-suffix">· 优秀作业展</span>
    </a>
    <a class="admin-link" href="admin.html">内容后台</a>
  </div>

  <div class="gallery" id="gallery">
    <div class="gallery-grid">
      <div class="left-column">
        <div class="channel-panel" data-channel="works" tabindex="0">
          <div class="panel-head">
            <span class="panel-title">优秀作业</span>
            <span class="panel-count">0 / 0</span>
            <div class="panel-controls">
              <button class="panel-control" type="button" data-direction="-1" aria-label="上一张优秀作业">‹</button>
              <button class="panel-control" type="button" data-direction="1" aria-label="下一张优秀作业">›</button>
            </div>
          </div>
          <div class="panel-stage"></div>
          <div class="panel-empty">暂未录入优秀作业</div>
        </div>

        <div class="channel-panel" data-channel="moments" tabindex="0">
          <div class="panel-head">
            <span class="panel-title">集训日常</span>
            <span class="panel-count">0 / 0</span>
            <div class="panel-controls">
              <button class="panel-control" type="button" data-direction="-1" aria-label="上一个集训日常">‹</button>
              <button class="panel-control" type="button" data-direction="1" aria-label="下一个集训日常">›</button>
            </div>
          </div>
          <div class="panel-stage"></div>
          <div class="panel-empty">暂未录入集训日常</div>
        </div>
      </div>

      <div class="channel-panel" data-channel="offers" tabindex="0">
        <div class="panel-head">
          <span class="panel-title">Offer 捷报</span>
          <span class="panel-count">0 / 0</span>
          <div class="panel-controls">
            <button class="panel-control" type="button" data-direction="-1" aria-label="上一张 Offer">‹</button>
            <button class="panel-control" type="button" data-direction="1" aria-label="下一张 Offer">›</button>
          </div>
        </div>
        <div class="panel-stage"></div>
        <div class="panel-empty">暂未录入 Offer 捷报</div>
      </div>
    </div>

    <div class="portrait-nav" aria-label="内容频道">
      <button class="portrait-nav-item" type="button" data-channel="works" aria-current="true">优秀作业</button>
      <button class="portrait-nav-item" type="button" data-channel="moments" aria-current="false">集训日常</button>
      <button class="portrait-nav-item" type="button" data-channel="offers" aria-current="false">Offer 捷报</button>
    </div>

    <div class="slide-source" id="slide-source"></div>

    <p class="sr-only" aria-live="polite" id="gallery-status"></p>
  </div>

  <script src="gallery-content.js"></script>
  <script src="media-storage.js"></script>
  <script>
    const CONTENT_STORAGE_KEY = 'pixel100-gallery-content-v1';
    const AUTOPLAY_DELAY = 5600;
    const channelNames = {
      works: '优秀作业',
      moments: '集训日常',
      offers: 'Offer 捷报'
    };
    const managedChannels = new Set(Object.keys(channelNames));
    const panelStates = new Map();
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const portraitMode = window.matchMedia('(orientation: portrait)');
    let portraitChannel = 'works';
    GalleryContent.ensureBuiltins();
    let managedContent = [];
    try {
      managedContent = JSON.parse(localStorage.getItem(CONTENT_STORAGE_KEY) || '[]');
    } catch {
      managedContent = [];
    }
    const slidesContainer = document.querySelector('#slide-source');
    const status = document.querySelector('#gallery-status');

    function isValidManagedContent(content) {
      return Boolean(
        content
        && typeof content.id === 'string'
        && managedChannels.has(content.channel)
        && typeof content.title === 'string'
        && content.title.trim()
        && ['image', 'video'].includes(content.mediaType)
        && typeof content.source === 'string'
        && content.source.trim()
      );
    }

    function appendManagedContent(content, index) {
      const slide = document.createElement('div');
      const channel = content.channel;
      const title = content.title.trim();
      const author = content.author || '像素100&奇点同行';
      const media = content.mediaType === 'video'
        ? document.createElement('video')
        : document.createElement('img');

      slide.className = 'slide';
      slide.id = `managed-slide-${index}`;
      slide.dataset.channel = channel;
      slide.dataset.state = 'after';

      media.alt = `${author}的内容：${title}`;
      media.preload = 'metadata';
      if (content.mediaType === 'video') {
        media.controls = true;
        media.playsInline = true;
        media.muted = channel === 'moments';
        media.autoplay = channel === 'moments' && !portraitMode.matches;
      } else {
        media.loading = 'lazy';
      }
      MediaStore.resolve(content.source)
        .then(source => {
          media.src = source;
          if (panelStates.has(channel)) refreshPanel(channel);
        })
        .catch(() => {
          media.removeAttribute('src');
        });

      const artwork = document.createElement('div');
      artwork.className = 'artwork';
      artwork.append(media);
      if (channel === 'works' && content.author?.trim()) {
        const caption = document.createElement('div');
        const student = document.createElement('span');
        caption.className = 'caption';
        student.className = 'student';
        student.textContent = `作者：${content.author.trim()}`;
        caption.append(student);
        artwork.append(caption);
      }

      slide.append(artwork);
      slidesContainer.append(slide);
    }

    managedContent
      .filter(isValidManagedContent)
      .forEach(appendManagedContent);

    const panels = [...document.querySelectorAll('.channel-panel')];
    const portraitNav = document.querySelector('.portrait-nav');
    const portraitNavItems = [...document.querySelectorAll('.portrait-nav-item')];
    const panelByChannel = new Map(panels.map(panel => [panel.dataset.channel, panel]));
    [...slidesContainer.querySelectorAll('.slide')].forEach(slide => {
      const channel = slide.dataset.channel || 'works';
      const panel = panelByChannel.get(channel);
      if (panel) {
        slide.dataset.channel = channel;
        panel.querySelector('.panel-stage').append(slide);
      } else {
        slide.remove();
      }
    });

    function isPanelVisible(channel) {
      return !portraitMode.matches || channel === portraitChannel;
    }

    function refreshPanel(channel) {
      const state = panelStates.get(channel);
      if (!state) return;
      const { panel, slides } = state;
      clearTimeout(state.timer);
      panel.dataset.empty = String(slides.length === 0);

      if (!slides.length) {
        panel.querySelector('.panel-count').textContent = '0 / 0';
        return;
      }

      state.index = (state.index + slides.length) % slides.length;
      slides.forEach((slide, index) => {
        const isActive = index === state.index;
        slide.dataset.state = isActive ? 'active' : index < state.index ? 'before' : 'after';
        slide.setAttribute('aria-hidden', String(!isActive));
        const video = slide.querySelector('video');
        if (video && !isActive) video.pause();
      });

      panel.querySelector('.panel-count').textContent = `${state.index + 1} / ${slides.length}`;
      if (!isPanelVisible(channel)) {
        slides.forEach(slide => slide.querySelectorAll('video').forEach(video => video.pause()));
        return;
      }
      status.textContent = `${channelNames[channel]}正在展示第 ${state.index + 1} 项`;

      const activeVideo = slides[state.index].querySelector('video');
      if (channel === 'moments' && activeVideo) {
        activeVideo.muted = true;
        activeVideo.onended = () => advancePanel(channel);
        if (!document.hidden) activeVideo.play().catch(() => {});
        return;
      }

      if (document.hidden || reducedMotion.matches || slides.length < 2) return;
      state.timer = setTimeout(() => advancePanel(channel), AUTOPLAY_DELAY);
    }

    function advancePanel(channel, direction = 1) {
      const state = panelStates.get(channel);
      if (!state?.slides.length) return;
      state.index = (state.index + direction + state.slides.length) % state.slides.length;
      refreshPanel(channel);
    }

    panels.forEach(panel => {
      const channel = panel.dataset.channel;
      const slides = [...panel.querySelectorAll('.slide')];
      const state = { panel, slides, index: 0, timer: null, pointerStartX: null };
      panelStates.set(channel, state);

      panel.querySelectorAll('.panel-control').forEach(button => {
        button.addEventListener('click', () => advancePanel(channel, Number(button.dataset.direction)));
      });

      panel.addEventListener('keydown', event => {
        if (event.key === 'ArrowRight') advancePanel(channel);
        if (event.key === 'ArrowLeft') advancePanel(channel, -1);
      });

      panel.addEventListener('pointerdown', event => {
        state.pointerStartX = event.clientX;
      });

      panel.addEventListener('pointerup', event => {
        if (state.pointerStartX === null) return;
        const distance = event.clientX - state.pointerStartX;
        state.pointerStartX = null;
        if (Math.abs(distance) < 50) return;
        advancePanel(channel, distance < 0 ? 1 : -1);
      });
    });

    function refreshAllPanels() {
      panelStates.forEach((_, channel) => refreshPanel(channel));
    }

    function updateResponsiveMode() {
      const isPortrait = portraitMode.matches;
      panels.forEach(panel => {
        const isActive = !isPortrait || panel.dataset.channel === portraitChannel;
        panel.dataset.portraitActive = String(isActive);
        panel.setAttribute('aria-hidden', String(!isActive));
      });
      portraitNav.setAttribute('aria-hidden', String(!isPortrait));
      portraitNavItems.forEach(item => {
        item.setAttribute('aria-current', String(item.dataset.channel === portraitChannel));
      });
      refreshAllPanels();
    }

    portraitNavItems.forEach(item => {
      item.addEventListener('click', () => {
        portraitChannel = item.dataset.channel;
        updateResponsiveMode();
      });
    });

    document.addEventListener('visibilitychange', refreshAllPanels);
    reducedMotion.addEventListener('change', refreshAllPanels);
    portraitMode.addEventListener('change', updateResponsiveMode);
    updateResponsiveMode();
  </script>
</body>
</html>
